<div class="board" role="group" aria-label="Tic Tac Toe board">
  @for (row of board(); track $index; let rowIndex = $index) {
    @for (cell of row; track $index; let columnIndex = $index) {
      <button
        class="cell"
        type="button"
        [class.cell-x]="cell === 'X'"
        [class.cell-o]="cell === 'O'"
        [class.winning-cell]="isWinningCell(rowIndex, columnIndex)"
        [disabled]="cell !== null || gameOver()"
        [attr.aria-label]="'Row ' + (rowIndex + 1) + ', Column ' + (columnIndex + 1) + (cell ? ', ' + cell : ', empty')"
        [attr.aria-pressed]="cell !== null"
        (click)="selectCell(rowIndex, columnIndex)"
      >
        {{ cell ?? '' }}
      </button>
    }
  }
</div>
